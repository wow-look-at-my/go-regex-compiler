name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          generate: 44e1d2620691
          # One Cosmopolitan fat APE covers the linux/{amd64,arm64} and
          # windows/amd64 release slots; darwin/arm64, darwin/amd64 and
          # windows/arm64 stay native builds (darwin/arm64 deliberately so:
          # the go-toolchain pipeline wedges under the APE on macOS -- see
          # the go-toolchain pipeline wedges under the APE on macOS, so macs
          # are served native binaries).
          targets: 'cosmo,darwin/amd64,darwin/arm64,windows/arm64'
