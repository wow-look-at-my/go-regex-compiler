name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          generate: 44e1d2620691
          # The APE covers linux and windows/amd64; darwin stays native, since the pipeline wedges under it on macOS.
          targets: 'cosmo,darwin/amd64,darwin/arm64,windows/arm64'
