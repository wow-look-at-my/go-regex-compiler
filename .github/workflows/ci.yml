name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TEMPORARY proof pin: exercises the APE-assimilation install fix on the
      # go-toolchain action branch against the real v1 APE binary. Revert to
      # @v1 once verified (next commit).
      - uses: wow-look-at-my/go-toolchain@claude/laughing-heisenberg-87lkft
        with:
          generate: 44e1d2620691
          # One Cosmopolitan fat APE covers the linux/{amd64,arm64} and
          # windows/amd64 release slots; darwin/arm64, darwin/amd64 and
          # windows/arm64 stay native builds (darwin/arm64 deliberately so:
          # the go-toolchain pipeline wedges under the APE on macOS -- see
          # go-toolchain#275 -- so macs are served native binaries until that
          # is fixed). Inert until go-toolchain#275 reaches @v1 (until then
          # @v1 ignores the input with a warning and builds the usual
          # 6-binary native matrix).
          targets: 'cosmo,darwin/amd64,darwin/arm64,windows/arm64'
