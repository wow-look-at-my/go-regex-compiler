name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          generate: 44e1d2620691
          # One Cosmopolitan fat APE covers the linux/{amd64,arm64},
          # darwin/arm64 and windows/amd64 release slots; darwin/amd64 and
          # windows/arm64 stay native builds. Inert until go-toolchain#275
          # reaches @v1 (until then @v1 ignores the input with a warning and
          # builds the usual 6-binary native matrix).
          targets: 'cosmo,darwin/amd64,windows/arm64'
